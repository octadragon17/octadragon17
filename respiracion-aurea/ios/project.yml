# Proyecto Xcode generado con XcodeGen:  brew install xcodegen && ./sync-web.sh && xcodegen
name: VorticeAureo
options:
  bundleIdPrefix: com.vorticeaureo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  VorticeAureo:
    type: application
    platform: iOS
    sources:
      - path: VorticeAureo
        excludes:
          - "web/**"
          - "Info.plist"
      - path: VorticeAureo/web
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Sincronizar app web
        script: '"${SRCROOT}/sync-web.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: VorticeAureo/Info.plist
      properties:
        CFBundleDisplayName: "Vórtice Áureo"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vorticeaureo.app
        PRODUCT_NAME: VorticeAureo
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # Pon aquí tu Team ID (Xcode > Settings > Accounts) o elígelo en Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
